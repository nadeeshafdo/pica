<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pica preview</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f4f5;
    color: #27272a;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e4e4e7;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  #filepath { font-size: 12px; color: #71717a; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button {
    font-size: 12px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #d4d4d8; background: #fff; cursor: pointer;
  }
  header button:hover { background: #fafafa; }
  #stage { flex: 1; overflow: hidden; position: relative; }
  #viewport { width: 100%; height: 100%; overflow: hidden; cursor: grab; }
  #viewport.dragging { cursor: grabbing; }
  #artboard {
    transform-origin: 0 0;
    background: #ffffff;
    border: 1px solid #d4d4d8;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    position: absolute;
    left: 0; top: 0;
  }
  #artboard svg { display: block; }
  .checker {
    background-image:
      linear-gradient(45deg, #ececee 25%, transparent 25%),
      linear-gradient(-45deg, #ececee 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ececee 75%),
      linear-gradient(-45deg, transparent 75%, #ececee 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  footer {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; background: #ffffff; border-top: 1px solid #e4e4e7;
    font-size: 12px; color: #52525b;
  }
  footer button {
    font-size: 12px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid #d4d4d8; background: #fff; cursor: pointer; min-width: 64px;
  }
  footer button:hover { background: #fafafa; }
  #scrub { flex: 1; }
  #status { font-size: 11px; color: #a1a1aa; }
</style>
</head>
<body>
<header>
  <h1>pica preview</h1>
  <span id="filepath">waiting for file</span>
  <span style="flex:1"></span>
  <button id="fit">Fit to screen</button>
</header>
<div id="stage">
  <div id="viewport">
    <div id="artboard" class="checker"></div>
  </div>
</div>
<footer>
  <button id="playpause">Pause</button>
  <input id="scrub" type="range" min="0" max="2000" value="0" step="1">
  <span id="timelabel">0 / 2000 ms</span>
  <span id="status"></span>
</footer>
<script>
(function () {
  const artboard = document.getElementById('artboard');
  const viewport = document.getElementById('viewport');
  const scrub = document.getElementById('scrub');
  const timelabel = document.getElementById('timelabel');
  const playpause = document.getElementById('playpause');
  const fitBtn = document.getElementById('fit');
  const filepathEl = document.getElementById('filepath');
  const statusEl = document.getElementById('status');

  let scale = 1, tx = 40, ty = 40;
  let durationMs = 2000;
  let playing = true;
  let currentPath = '';
  let lastW = 0, lastH = 0;
  let fittedOnce = false;

  function applyTransform() {
    artboard.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
  function fit() {
    const r = viewport.getBoundingClientRect();
    const w = artboard.offsetWidth || 800;
    const h = artboard.offsetHeight || 600;
    scale = Math.min((r.width - 80) / w, (r.height - 80) / h, 2);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    tx = (r.width - w * scale) / 2;
    ty = (r.height - h * scale) / 2;
    applyTransform();
  }
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ns = Math.min(8, Math.max(0.05, scale * factor));
    tx = mx - (mx - tx) * (ns / scale);
    ty = my - (my - ty) * (ns / scale);
    scale = ns;
    applyTransform();
  }, { passive: false });

  let drag = null;
  viewport.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    viewport.classList.add('dragging');
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!drag) return;
    tx = drag.tx + (e.clientX - drag.x);
    ty = drag.ty + (e.clientY - drag.y);
    applyTransform();
  });
  viewport.addEventListener('pointerup', () => { drag = null; viewport.classList.remove('dragging'); });
  fitBtn.addEventListener('click', fit);

  function allAnims() {
    try { return document.getAnimations({ subtree: true }); }
    catch (e) { return document.getAnimations(); }
  }
  playpause.addEventListener('click', () => {
    const anims = allAnims();
    playing = !playing;
    anims.forEach((a) => { try { playing ? a.play() : a.pause(); } catch (e) {} });
    playpause.textContent = playing ? 'Pause' : 'Play';
  });
  scrub.addEventListener('input', () => {
    const t = Number(scrub.value);
    const anims = allAnims();
    anims.forEach((a) => { try { a.pause(); a.currentTime = t; } catch (e) {} });
    playing = false;
    playpause.textContent = 'Play';
    timelabel.textContent = `${t} / ${durationMs} ms`;
  });

  setInterval(() => {
    if (!playing) return;
    const anims = allAnims();
    if (anims.length === 0) return;
    const t = anims[0].currentTime;
    if (typeof t === 'number' && isFinite(t)) {
      const c = Math.floor(t % (durationMs || 1));
      scrub.value = String(c);
      timelabel.textContent = `${c} / ${durationMs} ms`;
    }
  }, 100);

  function parseSvgDims(svg) {
    const wAttr = svg.getAttribute && svg.getAttribute('width');
    const hAttr = svg.getAttribute && svg.getAttribute('height');
    let w = wAttr ? parseFloat(wAttr) : NaN;
    let h = hAttr ? parseFloat(hAttr) : NaN;
    if ((!isFinite(w) || !isFinite(h)) && svg.getAttribute) {
      const vb = svg.getAttribute('viewBox');
      if (vb) {
        const parts = vb.trim().split(/[\s,]+/).map(Number);
        if (parts.length === 4 && parts.every(isFinite)) {
          if (!isFinite(w)) w = parts[2];
          if (!isFinite(h)) h = parts[3];
        }
      }
    }
    return { w: isFinite(w) ? w : 800, h: isFinite(h) ? h : 600 };
  }

  function extractSvg(text) {
    try {
      const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
      if (doc.querySelector('parsererror')) return null;
      const svg = doc.querySelector('svg');
      if (!svg) return null;
      return { svg, owned: true, doc };
    } catch (e) {
      return null;
    }
  }

  async function load() {
    try {
      statusEl.textContent = 'loading';
      const res = await fetch('/svg', { cache: 'no-store' });
      if (!res.ok) { statusEl.textContent = 'no file yet'; return; }
      const text = await res.text();
      const nextPath = res.headers.get('x-pica-path') || currentPath;
      const parsed = extractSvg(text);
      if (!parsed || !parsed.svg) { statusEl.textContent = 'parse failed'; return; }
      currentPath = nextPath;
      filepathEl.textContent = currentPath || 'live svg';
      const dims = parseSvgDims(parsed.svg);
      const pathChanged = parsed.svg && nextPath !== filepathEl.dataset.path;
      const dimsChanged = dims.w !== lastW || dims.h !== lastH;
      filepathEl.dataset.path = nextPath || '';
      // Adopt the parsed node into the live document.
      const svg = parsed.owned ? document.importNode(parsed.svg, true) : parsed.svg;
      artboard.innerHTML = '';
      artboard.appendChild(svg);
      try {
        const meta = svg.querySelector('#pica-meta');
        if (meta && meta.textContent) {
          const j = JSON.parse(meta.textContent.trim());
          if (typeof j.durationMs === 'number') {
            durationMs = j.durationMs;
            scrub.max = String(durationMs);
            timelabel.textContent = `0 / ${durationMs} ms`;
          }
        }
      } catch (e) {}
      playing = true;
      playpause.textContent = 'Pause';
      // Only reset the camera on first load, path switch, or canvas resize.
      // Live patches preserve the user's zoom/pan.
      if (!fittedOnce || pathChanged || dimsChanged) {
        lastW = dims.w;
        lastH = dims.h;
        fittedOnce = true;
        fit();
      }
      statusEl.textContent = '';
    } catch (e) {
      statusEl.textContent = 'load failed';
    }
  }

  function connectWs() {
    let url = 'ws://' + location.host + '/ws';
    const ws = new WebSocket(url);
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'reload') load();
      } catch (e) { load(); }
    };
    ws.onclose = () => setTimeout(connectWs, 1500);
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  applyTransform();
  load();
  connectWs();
})();
</script>
</body>
</html>
